<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" rx="24" fill="#f2ecfa"/><g font-family="Arial,sans-serif"><text x="60" y="86" fill="#30223e" font-size="36" font-weight="700">CPF regular não significa nome limpo</text><text x="60" y="132" fill="#655771" font-size="24">Cada consulta responde a uma pergunta.</text><rect x="60" y="190" width="340" height="340" rx="20" fill="white"/><text x="84" y="255" font-size="25" font-weight="700" fill="#7136c9">Cadastro do CPF</text><text x="84" y="325" font-size="21" fill="#514b59">Meu cadastro está regular?</text><text x="84" y="380" font-size="21" fill="#514b59">Receita Federal</text><text x="84" y="435" font-size="21" fill="#514b59">Não informa negativação</text><rect x="430" y="190" width="340" height="340" rx="20" fill="white"/><text x="454" y="255" font-size="25" font-weight="700" fill="#7136c9">Restrições de crédito</text><text x="454" y="325" font-size="21" fill="#514b59">Há registros nesta base?</text><text x="454" y="380" font-size="21" fill="#514b59">Serviço de crédito</text><text x="454" y="435" font-size="21" fill="#514b59">Verifique a cobertura</text><rect x="800" y="190" width="340" height="340" rx="20" fill="white"/><text x="824" y="255" font-size="25" font-weight="700" fill="#7136c9">Situação fiscal</text><text x="824" y="325" font-size="21" fill="#514b59">Há pendências fiscais?</text><text x="824" y="380" font-size="21" fill="#514b59">Canal fiscal da Receita</text><text x="824" y="435" font-size="21" fill="#514b59">Consulta separada</text><text x="60" y="610" font-size="22" fill="#655771">Descobridor · Consulte o canal adequado ao seu objetivo</text></g></svg>