<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Três caminhos seguros para conferir uma data</title><desc id="desc">Documento próprio, Registro Civil e conferência com autorização</desc><defs><linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbf9ff"/><stop offset=".53" stop-color="#f0e9ff"/><stop offset="1" stop-color="#e5d7ff"/></linearGradient><linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9561e6"/><stop offset="1" stop-color="#5d2cac"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#3a1e6e" flood-opacity=".15"/></filter></defs><rect width="1200" height="675" fill="url(#back)"/><circle cx="1120" cy="60" r="224" fill="#ddccfc" opacity=".65"/><circle cx="83" cy="655" r="175" fill="#e4d9fb" opacity=".85"/>
<text x="600" y="88" text-anchor="middle" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#342546">Como confirmar a data correta?</text>
<text x="600" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#6c5a7c">Escolha o caminho adequado à sua situação</text>
<g transform="translate(34 183)" font-family="Arial,sans-serif" filter="url(#shadow)"><rect width="332" height="360" rx="27" fill="#fff"/><circle cx="166" cy="99" r="68" fill="#eee5fd"/><path d="M136 59h55l23 23v78h-78z" stroke="#7544bc" stroke-width="7" fill="none" stroke-linejoin="round"/><path d="M191 59v27h23M151 109h43M151 130h43" stroke="#7544bc" stroke-width="6" fill="none" stroke-linecap="round"/><text x="166" y="210" font-size="25" font-weight="700" fill="#3c2b54" text-anchor="middle">Documentos próprios</text><text x="166" y="253" font-size="18" fill="#766683" text-anchor="middle">Certidão, identidade</text><text x="166" y="283" font-size="18" fill="#766683" text-anchor="middle">e registros pessoais</text><rect x="41" y="315" width="250" height="7" rx="3" fill="#d6c3f1"/></g>
<g transform="translate(434 183)" font-family="Arial,sans-serif" filter="url(#shadow)"><rect width="332" height="360" rx="27" fill="#fff"/><circle cx="166" cy="99" r="68" fill="#eee5fd"/><rect x="116" y="58" width="100" height="100" rx="14" fill="none" stroke="#7544bc" stroke-width="7"/><path d="M138 87h57M138 112h46M138 137h62" stroke="#7544bc" stroke-width="7" stroke-linecap="round"/><text x="166" y="210" font-size="25" font-weight="700" fill="#3c2b54" text-anchor="middle">Registro Civil</text><text x="166" y="253" font-size="18" fill="#766683" text-anchor="middle">Solicite a segunda via</text><text x="166" y="283" font-size="18" fill="#766683" text-anchor="middle">da certidão necessária</text><rect x="41" y="315" width="250" height="7" rx="3" fill="#d6c3f1"/></g>
<g transform="translate(834 183)" font-family="Arial,sans-serif" filter="url(#shadow)"><rect width="332" height="360" rx="27" fill="#fff"/><circle cx="166" cy="99" r="68" fill="#eee5fd"/><path d="M166 46l47 18v38q-4 43-47 66-43-23-47-66V64z" fill="none" stroke="#7544bc" stroke-width="7"/><path d="M140 108l18 17 38-39" fill="none" stroke="#7544bc" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="166" y="210" font-size="25" font-weight="700" fill="#3c2b54" text-anchor="middle">Conferência segura</text><text x="166" y="253" font-size="18" fill="#766683" text-anchor="middle">Dados próprios ou</text><text x="166" y="283" font-size="18" fill="#766683" text-anchor="middle">com base legal adequada</text><rect x="41" y="315" width="250" height="7" rx="3" fill="#d6c3f1"/></g>
<text x="600" y="588" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#59486d">Não forneça documentos ou senhas em sites sem origem verificada</text><text x="600" y="642" text-anchor="middle" font-family="Arial,sans-serif" fill="#79688b" font-size="16">Ilustração educativa • sem documentos ou dados pessoais reais</text></svg>