<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><title>Checklist para conferir um telefone</title><desc>Quatro passos para uma consulta segura.</desc><rect width="1200" height="800" rx="36" fill="#f7f3ed"/><circle cx="1050" cy="110" r="150" fill="#ed9a65" opacity=".28"/><text x="90" y="120" font-family="Arial" font-size="42" font-weight="700" fill="#176b5b">Uma conferência segura começa antes da consulta</text><g font-family="Arial"><g transform="translate(95 215)"><circle cx="45" cy="45" r="45" fill="#176b5b"/><text x="32" y="59" font-size="34" fill="#fff">1</text><text x="120" y="38" font-size="30" font-weight="700" fill="#253137">Confira o formato</text><text x="120" y="78" font-size="22" fill="#52615e">DDD e número correto</text></g><g transform="translate(95 350)"><circle cx="45" cy="45" r="45" fill="#2c9b7b"/><text x="32" y="59" font-size="34" fill="#fff">2</text><text x="120" y="38" font-size="30" font-weight="700" fill="#253137">Defina a finalidade</text><text x="120" y="78" font-size="22" fill="#52615e">Dado próprio ou autorizado</text></g><g transform="translate(95 485)"><circle cx="45" cy="45" r="45" fill="#d77b4e"/><text x="32" y="59" font-size="34" fill="#fff">3</text><text x="120" y="38" font-size="30" font-weight="700" fill="#253137">Verifique a fonte</text><text x="120" y="78" font-size="22" fill="#52615e">Origem e atualização</text></g><g transform="translate(95 620)"><circle cx="45" cy="45" r="45" fill="#5e9b87"/><text x="32" y="59" font-size="34" fill="#fff">4</text><text x="120" y="38" font-size="30" font-weight="700" fill="#253137">Confirme antes de usar</text><text x="120" y="78" font-size="22" fill="#52615e">Respeito à privacidade</text></g></g><g transform="translate(820 260)"><rect width="250" height="330" rx="32" fill="#253137"/><rect x="23" y="43" width="204" height="220" rx="18" fill="#d9eee4"/><path d="M70 170l34 33 78-91" fill="none" stroke="#176b5b" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><rect 