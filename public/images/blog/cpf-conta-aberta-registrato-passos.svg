<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Três etapas para consultar o Registrato e o relatório CCS"><title>Como consultar contas no Registrato</title><defs><linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1E34"/><stop offset="1" stop-color="#173B57"/></linearGradient><linearGradient id="sea" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1DD4BD"/><stop offset="1" stop-color="#087C91"/></linearGradient></defs><rect width="960" height="540" rx="28" fill="#F0F7FA"/><text x="56" y="73" font-family="Arial,sans-serif" font-weight="700" font-size="34" fill="#102C43">Consulte suas contas em 3 passos</text><text x="57" y="110" font-family="Arial,sans-serif" font-size="19" fill="#546D7D">Acesso gratuito pelo Banco Central</text><path d="M196 298h574" stroke="#A4C5CC" stroke-width="7" stroke-dasharray="10 13"/><g font-family="Arial,sans-serif"><rect x="52" y="163" width="267" height="274" rx="24" fill="#FFFFFF" stroke="#D8E8EC"/><circle cx="185" cy="218" r="38" fill="url(#sea)"/><text x="171" y="232" font-size="40" fill="#FFFFFF" font-weight="700">1</text><text x="96" y="296" font-size="27" font-weight="700" fill="#15344A">Meu BC</text><text x="96" y="334" font-size="19" fill="#536A78">Entre com gov.br</text><text x="96" y="365" font-size="19" fill="#536A78">prata ou ouro + 2FA</text><rect x="346" y="163" width="267" height="274" rx="24" fill="#FFFFFF" stroke="#D8E8EC"/><circle cx="479" cy="218" r="38" fill="url(#sea)"/><text x="465" y="232" font-size="40" fill="#FFFFFF" font-weight="700">2</text><text x="390" y="296" font-size="27" font-weight="700" fill="#15344A">Registrato</text><text x="390" y="334" font-size="19" fill="#536A78">Abra os relatórios</text><text x="390" y="365" font-size="19" fill="#536A78">da sua vida financeira</text><rect x="640" y="163" width="267" height="274" rx="24" fill="#FFFFFF" stroke="#D8E8EC"/><circle cx="773" cy="218" r="38" fill="url(#sea)"/><text x="759" y="232" font-size="40" fill="#FFFFFF" font-weight="700">3</text><text x="683" y="296" font-size="27" font-weight="700" fill="#15344A">Relatório CCS</text><text x="683" y="334" font-size="19" fill="#536A78">Veja instituições e</text><text x="683" y="365" font-size="19" fill="#536A78">datas de relacionamento</text><text x="57" y="498" font-size="18" fill="#6E8993">Ilustração didática • não é uma captura de tela</text></g></svg>