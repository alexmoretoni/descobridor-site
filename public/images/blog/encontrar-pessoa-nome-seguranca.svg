<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Antes de contatar uma pessoa confira identidade e privacidade</title><desc id="d">Checklist informativo para evitar homônimos, dados desatualizados e mensagens invasivas</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fbf9ff"/><stop offset="1" stop-color="#e9dcff"/></linearGradient><linearGradient id="purple" x2="1" y2="1"><stop stop-color="#9a6ae2"/><stop offset="1" stop-color="#612fb0"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#39216d" flood-opacity=".15"/></filter></defs><rect width="1200" height="675" fill="url(#bg)"/><circle cx="1100" cy="60" r="200" fill="#e4d4ff"/><circle cx="110" cy="625" r="190" fill="#e4d8f6"/>
<text x="600" y="88" text-anchor="middle" font-family="Arial,sans-serif" font-size="41" font-weight="700" fill="#2e2244">Antes de entrar em contato</text>
<g transform="translate(102 165)" font-family="Arial,sans-serif"><rect width="996" height="109" rx="27" fill="#fff" stroke="#e5d9f0" stroke-width="2"/><circle cx="73" cy="54" r="34" fill="#e9dcfa"/><path d="M55 54l11 12 24-27" fill="none" stroke="#7443c0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="142" y="42" font-size="26" font-weight="700" fill="#39274a">Confirme o contexto</text><text x="142" y="78" font-size="18" fill="#665a76">Cidade ou profissão pública podem ajudar, mas não são prova de identidade</text></g><g transform="translate(102 297)" font-family="Arial,sans-serif"><rect width="996" height="109" rx="27" fill="#fff" stroke="#e5d9f0" stroke-width="2"/><circle cx="73" cy="54" r="34" fill="#e9dcfa"/><path d="M55 54l11 12 24-27" fill="none" stroke="#7443c0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="142" y="42" font-size="26" font-weight="700" fill="#39274a">Respeite a escolha</text><text x="142" y="78" font-size="18" fill="#665a76">Se a pessoa não quiser contato, não insista nem contorne bloqueios</text></g><g transform="translate(102 429)" font-family="Arial,sans-serif"><rect width="996" height="109" rx="27" fill="#fff" stroke="#e5d9f0" stroke-width="2"/><circle cx="73" cy="54" r="34" fill="#e9dcfa"/><path d="M55 54l11 12 24-27" fill="none" stroke="#7443c0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="142" y="42" font-size="26" font-weight="700" fill="#39274a">Proteja os dados</text><text x="142" y="78" font-size="18" fill="#665a76">Não publique endereço, CPF ou telefone privado de terceiros</text></g>
<rect x="315" y="580" width="570" height="37" rx="18" fill="url(#purple)"/><text x="600" y="605" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">Pesquise de forma legítima e respeitosa</text><text x="600" y="636" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#7e7091">Ilustração educativa • Nenhum dado pessoal real</text></svg>