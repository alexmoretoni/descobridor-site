<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="t d"><title id="t">Três caminhos para confirmar a data de nascimento</title><desc id="d">Comparativo entre conferir os documentos próprios, pedir uma certidão no Registro Civil e solicitar uma conferência autorizada</desc><rect width="1000" height="470" rx="28" fill="#f0f8f2"/><g font-family="Arial,Helvetica,sans-serif"><text x="43" y="66" font-size="28" fill="#1b4933" font-weight="700">Como confirmar a data de nascimento?</text><text x="43" y="105" font-size="18" fill="#5c7565">Selecione o procedimento compatível com sua necessidade.</text><g><rect x="36" y="144" width="292" height="258" rx="18" fill="#fff" stroke="#d4e8d9" stroke-width="3"/><circle cx="88" cy="190" r="26" fill="#d9f0e1"/><text x="80" y="200" font-size="26" fill="#0c8451">1</text><text x="61" y="258" font-size="22" font-weight="700" fill="#1b4933">Documentos próprios</text><text x="61" y="302" font-size="18" fill="#617b6b">Conferir RG, CNH</text><text x="61" y="335" font-size="18" fill="#617b6b">ou certidão existente</text><rect x="61" y="366" width="154" height="7" rx="4" fill="#0da866"/></g><g><rect x="354" y="144" width="292" height="258" rx="18" fill="#fff" stroke="#d4e8d9" stroke-width="3"/><circle cx="406" cy="190" r="26" fill="#d9f0e1"/><text x="398" y="200" font-size="26" fill="#0c8451">2</text><text x="379" y="258" font-size="22" font-weight="700" fill="#1b4933">Registro Civil</text><text x="379" y="302" font-size="18" fill="#617b6b">Solicitar segunda via</text><text x="379" y="335" font-size="18" fill="#617b6b">da certidão oficial</text><rect x="379" y="366" width="154" height="7" rx="4" fill="#0da866"/></g><g><rect x="672" y="144" width="292" height="258" rx="18" fill="#fff" stroke="#d4e8d9" stroke-width="3"/><circle cx="724" cy="190" r="26" fill="#d9f0e1"/><text x="716" y="200" font-size="26" fill="#0c8451">3</text><text x="697" y="258" font-size="22" font-weight="700" fill="#1b4933">Conferência autorizada</text><text x="697" y="302" font-size="18" fill="#617b6b">Finalidade legítima</text><text x="697" y="335" font-size="18" fill="#617b6b">e validação do titular</text><rect x="697" y="366" width="154" height="7" rx="4" fill="#0da866"/></g></g></svg>