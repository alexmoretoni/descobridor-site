<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Três caminhos para pesquisar um nome com segurança</title><desc id="d">Infográfico com perfis públicos, contato respeitoso e conferência autorizada</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fbf9ff"/><stop offset="1" stop-color="#e9dcff"/></linearGradient><linearGradient id="purple" x2="1" y2="1"><stop stop-color="#9a6ae2"/><stop offset="1" stop-color="#612fb0"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#39216d" flood-opacity=".15"/></filter></defs><rect width="1200" height="675" fill="url(#bg)"/><circle cx="1100" cy="60" r="200" fill="#e4d4ff"/><circle cx="110" cy="625" r="190" fill="#e4d8f6"/>
<text x="600" y="91" text-anchor="middle" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#332447">Por onde começar?</text><text x="600" y="133" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#685875">Três caminhos legítimos e seguros</text>
<g transform="translate(52 190)" font-family="Arial,sans-serif" filter="url(#shadow)"><rect width="334" height="348" rx="29" fill="#fff" stroke="#e1d7f0" stroke-width="2"/><circle cx="167" cy="95" r="65" fill="#eee7fc"/><rect x="125" y="62" width="85" height="68" rx="15" fill="none" stroke="#7542bf" stroke-width="8"/><path d="M144 85h49M144 108h34" stroke="#7542bf" stroke-width="7" stroke-linecap="round"/><text x="167" y="215" text-anchor="middle" font-size="25" font-weight="700" fill="#392a4d">1. Fontes públicas</text><text x="167" y="260" text-anchor="middle" font-size="20" fill="#756880">Perfis que a pessoa</text><text x="167" y="290" text-anchor="middle" font-size="20" fill="#756880">decidiu divulgar</text></g><g transform="translate(434 190)" font-family="Arial,sans-serif" filter="url(#shadow)"><rect width="334" height="348" rx="29" fill="#fff" stroke="#e1d7f0" stroke-width="2"/><circle cx="167" cy="95" r="65" fill="#eee7fc"/><path d="M120 67h95v54h-39l-22 20v-20h-34z" fill="none" stroke="#7542bf" stroke-width="8" stroke-linejoin="round"/><path d="M144 89h49M144 107h27" stroke="#7542bf" stroke-width="6" stroke-linecap="round"/><text x="167" y="215" text-anchor="middle" font-size="25" font-weight="700" fill="#392a4d">2. Contato direto</text><text x="167" y="260" text-anchor="middle" font-size="20" fill="#756880">Mensagem breve ou</text><text x="167" y="290" text-anchor="middle" font-size="20" fill="#756880">contato em comum</text></g><g transform="translate(816 190)" font-family="Arial,sans-serif" filter="url(#shadow)"><rect width="334" height="348" rx="29" fill="#fff" stroke="#e1d7f0" stroke-width="2"/><circle cx="167" cy="95" r="65" fill="#eee7fc"/><path d="M167 45l48 18v45q-6 44-48 64-42-20-48-64V63z" fill="none" stroke="#7542bf" stroke-width="8"/><path d="M141 104l18 18 38-40" fill="none" stroke="#7542bf" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="167" y="215" text-anchor="middle" font-size="25" font-weight="700" fill="#392a4d">3. Conferência</text><text x="167" y="260" text-anchor="middle" font-size="20" fill="#756880">Dados próprios ou</text><text x="167" y="290" text-anchor="middle" font-size="20" fill="#756880">autorizados</text></g>
<text x="600" y="587" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#66567b">Nome igual não é prova de que seja a mesma pessoa</text><text x="600" y="636" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#7e7091">Ilustração educativa • Nenhum dado pessoal real</text></svg>