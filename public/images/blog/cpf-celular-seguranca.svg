<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Checklist segurança e privacidade</title><desc id="d">Verifique fonte, finalidade e proteção antes de consultar informações pelo celular</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f6f0ff"/><stop offset="1" stop-color="#eae0ff"/></linearGradient><linearGradient id="g" x2="1" y2="1"><stop stop-color="#925bea"/><stop offset="1" stop-color="#5c29af"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#422273" flood-opacity=".16"/></filter></defs><rect width="1200" height="675" rx="30" fill="url(#bg)"/><text x="600" y="87" font-family="Arial,sans-serif" font-size="45" font-weight="700" fill="#2d1b42" text-anchor="middle">Antes de consultar, confira</text><text x="600" y="127" font-family="Arial,sans-serif" font-size="22" fill="#695b77" text-anchor="middle">Três cuidados para não expor dados pessoais</text><g font-family="Arial,sans-serif" transform="translate(100 189)"><rect width="1000" height="105" rx="27" fill="#fff" stroke="#ded2f0" stroke-width="2"/><circle cx="70" cy="52" r="32" fill="#e7dafa"/><path d="M56 50l10 11 20-23" fill="none" stroke="#693cb7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="135" y="43" font-size="28" font-weight="700" fill="#332246">Fonte</text><text x="135" y="76" font-size="20" fill="#685a79">Quem mantém o serviço e de onde vêm os dados?</text></g><g font-family="Arial,sans-serif" transform="translate(100 319)"><rect width="1000" height="105" rx="27" fill="#fff" stroke="#ded2f0" stroke-width="2"/><circle cx="70" cy="52" r="32" fill="#e7dafa"/><path d="M56 50l10 11 20-23" fill="none" stroke="#693cb7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="135" y="43" font-size="28" font-weight="700" fill="#332246">Finalidade</text><text x="135" y="76" font-size="20" fill="#685a79">Você tem direito ou autorização para verificar?</text></g><g font-family="Arial,sans-serif" transform="translate(100 449)"><rect width="1000" height="105" rx="27" fill="#fff" stroke="#ded2f0" stroke-width="2"/><circle cx="70" cy="52" r="32" fill="#e7dafa"/><path d="M56 50l10 11 20-23" fill="none" stroke="#693cb7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="135" y="43" font-size="28" font-weight="700" fill="#332246">Proteção</text><text x="135" y="76" font-size="20" fill="#685a79">O site explica privacidade, limites e eventuais custos?</text></g><rect x="242" y="582" width="716" height="51" rx="17" fill="#6434b4"/><text x="600" y="616" font-family="Arial,sans-serif" text-anchor="middle" fill="#fff" font-weight="700" font-size="21">Nunca compartilhe senhas ou códigos de SMS</text></svg>