<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Comparação entre relatórios CCS e SCR do Banco Central"><title>CCS mostra contas, SCR mostra créditos</title><defs><linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1E34"/><stop offset="1" stop-color="#173B57"/></linearGradient><linearGradient id="sea" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1DD4BD"/><stop offset="1" stop-color="#087C91"/></linearGradient></defs><rect width="960" height="540" rx="28" fill="#0C263B"/><text x="54" y="78" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">Qual relatório devo consultar?</text><g font-family="Arial,sans-serif"><rect x="53" y="126" width="411" height="339" rx="24" fill="#F4FBFC"/><rect x="496" y="126" width="411" height="339" rx="24" fill="#F4FBFC"/><circle cx="116" cy="186" r="34" fill="#0CA8A3"/><path d="M97 194h38M101 183l15-10 15 10M106 194v14M125 194v14" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none"/><text x="171" y="195" font-size="31" font-weight="700" fill="#173B57">CCS</text><text x="85" y="263" font-size="27" font-weight="700" fill="#142F46">Contas e bancos</text><text x="85" y="306" font-size="21" fill="#536978">Onde você tem ou teve</text><text x="85" y="339" font-size="21" fill="#536978">relacionamento financeiro</text><rect x="85" y="376" width="340" height="46" rx="14" fill="#C8F4ED"/><text x="109" y="407" font-size="18" font-weight="700" fill="#0C6462">Útil para detectar conta estranha</text><circle cx="559" cy="186" r="34" fill="#0CA8A3"/><path d="M559 170v32M571 177c-26-14-30 11-12 9 20 0 16 25-12 13" stroke="#FFFFFF" stroke-width="4" fill="none"/><text x="613" y="195" font-size="31" font-weight="700" fill="#173B57">SCR</text><text x="529" y="263" font-size="27" font-weight="700" fill="#142F46">Crédito e dívidas</text><text x="529" y="306" font-size="21" fill="#536978">Empréstimos, financiamentos</text><text x="52