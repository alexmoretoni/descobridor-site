<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="t d"><title id="t">Modalidades de consulta por CPF</title><desc id="d">Quadro com recuperar CPF próprio, verificar situação cadastral e conferir dados autorizados</desc><rect width="1000" height="470" rx="28" fill="#f2f9f4"/><g font-family="Arial,Helvetica,sans-serif"><text x="50" y="64" fill="#174733" font-size="30" font-weight="700">Qual consulta você precisa?</text><text x="50" y="104" fill="#587264" font-size="19">Cada objetivo exige um procedimento próprio.</text><g><rect x="40" y="147" width="293" height="248" rx="19" fill="#fff" stroke="#cfe4d7" stroke-width="3"/><circle cx="91" cy="196" r="25" fill="#d7efdf"/><text x="83" y="205" font-size="26" fill="#087c4b">1</text><text x="65" y="260" fill="#174733" font-size="24" font-weight="700">Recuperar meu CPF</text><text x="65" y="300" fill="#627a6a" font-size="18">Identificar o titular</text><text x="65" y="332" fill="#627a6a" font-size="18">e procurar a Receita</text><rect x="65" y="353" width="156" height="7" rx="4" fill="#13a468"/></g><g><rect x="353" y="147" width="293" height="248" rx="19" fill="#fff" stroke="#cfe4d7" stroke-width="3"/><circle cx="404" cy="196" r="25" fill="#d7efdf"/><text x="396" y="205" font-size="26" fill="#087c4b">2</text><text x="378" y="260" fill="#174733" font-size="22" font-weight="700">Situação cadastral</text><text x="378" y="300" fill="#627a6a" font-size="18">Com o CPF conhecido,</text><text x="378" y="332" fill="#627a6a" font-size="18">em canais oficiais</text><rect x="378" y="353" width="156" height="7" rx="4" fill="#13a468"/></g><g><rect x="666" y="147" width="293" height="248" rx="19" fill="#fff" stroke="#cfe4d7" stroke-width="3"/><circle cx="717" cy="196" r="25" fill="#d7efdf"/><text x="709" y="205" font-size="26" fill="#087c4b">3</text><text x="690" y="260" fill="#174733" font-size="22" font-weight="700">Conferir cadastro</text><text x="690" y="300" fill="#627a6a" font-size="18">Finalidade legítima</text><text x="690" y="332" fill="#627a6a" font-size="18">e autorização</text><rect x="690" y="353" width="156" height="7" rx="4" fill="#13a468"/></g></g></svg>